name: Blockchain Integration Tests

on:
  workflow_dispatch:
    inputs:
      run_chain_tests:
        description: Run blockchain integration tests
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  pull_request:
    branches:
      - develop

jobs:
  chain-integration-test:
    name: Devnet BDD Integration Tests
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || inputs.run_chain_tests == 'true' }}

    env:
      RUN_CHAIN_TESTS: "true"
      ZNN_TEST_HTTP_URL: http://127.0.0.1:35997
      ZNN_TEST_NODE_URL: ws://127.0.0.1:35998
      # Public Docker devnet mnemonic/password from digitalSloth/go-zenon.
      # Devnet-only: never reuse these values on mainnet.
      ZNN_TEST_MNEMONIC: "abstract affair idle position alien fluid board ordinary exist afraid chapter wood wood guide sun walnut crew perfect place firm poverty model side million"
      ZNN_TEST_PASSWORD: devnet
      ZNN_TEST_SENDER_INDEX: "3"
      ZNN_TEST_RECIPIENT_INDEX: "8"

    steps:
      - name: Checkout syrius
        uses: actions/checkout@v4

      - name: Checkout devnet
        uses: actions/checkout@v4
        with:
          repository: digitalSloth/go-zenon
          ref: feature/docker-devnet
          path: go-zenon-devnet

      - name: Start devnet
        working-directory: go-zenon-devnet
        run: make devnet-up

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libjsoncpp-dev \
            liblzma-dev \
            libnotify-dev \
            libsecret-1-dev \
            ninja-build \
            pkg-config \
            xvfb

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Wait for devnet
        run: ./scripts/wait-for-devnet.sh

      - name: Generate BDD tests
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run blockchain integration tests
        run: xvfb-run -a flutter test integration_test -d linux

      - name: Dump devnet logs
        if: failure()
        working-directory: go-zenon-devnet
        run: docker compose logs --no-color

      - name: Stop devnet
        if: always()
        working-directory: go-zenon-devnet
        run: make devnet-down || true
