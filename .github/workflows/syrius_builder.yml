name: Build and release syrius

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Checkout zenon-node-database repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: zenon-network/zenon-node-database
          path: ./node-db
          ref: main
      - name: Copy community nodes
        run: cp -r ./node-db/rpc-nodes-mainnet.json ./assets/community-nodes.json
      - name: Setup environment
        run: |
          brew install unzip create-dmg
          brew cleanup
      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
      - name: Check flutter version
        run: flutter --version
      - name: Generate Git metadata
        run: dart run tool/generate_git_metadata.dart
      - name: Build syrius desktop 
        run: |
          flutter config --enable-macos-desktop
          flutter build macos --release --dart-define-from-file=.dart_tool/git_metadata.json
      - name: Package into DMG
        run: |
          create-dmg --volname syrius \
          --volicon macos/dmg/volume.icns \
          --icon "s\ y\ r\ i\ u\ s.app" 210 175 \
          --icon-size 90 \
          --app-drop-link 390 175 \
          --text-size 14 \
          --background macos/dmg/background.png \
          --window-pos 300 200 \
          --window-size 600 325 \
          --hide-extension "s\ y\ r\ i\ u\ s.app" \
          --format ULFO \
          --hdiutil-verbose \
          syrius-alphanet-macos-universal.dmg build/macos/Build/Products/Release/s\ y\ r\ i\ u\ s.app
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-artifacts
          path: syrius-alphanet-macos-universal.dmg
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Checkout zenon-node-database repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: zenon-network/zenon-node-database
          path: ./node-db
          ref: main
      - name: Copy community nodes
        shell: pwsh
        run: Copy-Item .\node-db\rpc-nodes-mainnet.json .\assets\community-nodes.json -Force
      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
      - name: Check flutter version
        run: flutter --version
      - name: Generate Git metadata
        run: dart run tool/generate_git_metadata.dart
      - name: Build syrius desktop
        run: |
          flutter config --enable-windows-desktop
          flutter build windows --release --dart-define-from-file=.dart_tool/git_metadata.json
      - name: Package into zip
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath .\syrius-alphanet-windows-amd64.zip
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-artifacts
          path: syrius-alphanet-windows-amd64.zip
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Checkout zenon-node-database repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: zenon-network/zenon-node-database
          path: ./node-db
          ref: main
      - name: Copy community nodes
        run: cp -r ./node-db/rpc-nodes-mainnet.json assets/community-nodes.json
      - name: Prepare environment
        run: |
          sudo apt update
          sudo apt update
          sudo apt install -y libsecret-1-dev libjsoncpp-dev
          sudo apt install -y curl clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev unzip xz-utils zip libnotify-dev libayatana-appindicator3-dev
      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
      - name: Set permissions
        run: |
          sudo chmod -R 777 linux/
      - name: Check flutter version
        run: |
          which flutter
          flutter --version
      - name: Generate Git metadata
        run: dart run tool/generate_git_metadata.dart
      - name: Build syrius desktop
        run: |
          flutter config --enable-linux-desktop
          flutter build linux --release --dart-define-from-file=.dart_tool/git_metadata.json -v
      - name: Package zip
        run: |
          cd build/linux/x64/release/bundle
          zip -r ../../../../../syrius-alphanet-linux-amd64.zip *
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-artifacts
          path: syrius-alphanet-linux-amd64.zip
  make-release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set variables
        env:
          SYRIUS_VERSION: ${{ github.ref_name }}
          GITHUB_REF_VALUE: ${{ github.ref }}
          GITHUB_REPO_URL: ${{ github.repositoryUrl }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
          GITHUB_WORKFLOW_SHA_VALUE: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          echo "SYRIUS_VERSION=${SYRIUS_VERSION}" >> "${GITHUB_ENV}"
          echo "Syrius Version: ${SYRIUS_VERSION}"
          GOZENON="$(python3 -c 'import json; r = json.load(open("lib/embedded_node/blobs/libznn.manifest.json"))["release"]; print(r.get("name") or r["tag"])')"
          echo "Go-Zenon Version: ${GOZENON}"
          BODY=$(cat <<EOF
          Syrius ${SYRIUS_VERSION} features the pre-release version of the [go-zenon](https://github.com/zenon-network/go-zenon) ${GOZENON} full node.

          Syrius for Windows requires Microsoft Visual C++ to be installed.
          [Download Microsoft Visual C++](https://aka.ms/vs/16/release/vc_redist.x64.exe)

          Github Action Context information
          Git reference: ${GITHUB_REF_VALUE}
          Repository URL:  ${GITHUB_REPO_URL}
          Run ID: ${GITHUB_RUN_ID_VALUE}
          Commit hash: ${GITHUB_SHA_VALUE}
          Workflow hash: ${GITHUB_WORKFLOW_SHA_VALUE}
          EOF
          )
          echo "${BODY}"
          {
            echo "BODY<<EOFMARKER"
            echo "${BODY}"
            echo "EOFMARKER"
          } >> "${GITHUB_ENV}"
      - name: Prepare releases directory
        run: mkdir releases
      - name: Download macOS artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-artifacts
      - name: Download Windows artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-artifacts
      - name: Download Linux artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-artifacts
      - name: Prepare releases
        run: |
          cp syrius-alphanet-windows-amd64.zip releases/
          cp syrius-alphanet-macos-universal.dmg releases/
          cp syrius-alphanet-linux-amd64.zip releases/
      - name: Generate and verify checksums
        run: |
          cd releases/
          sha256sum syrius-alphanet-windows-amd64.zip \
            syrius-alphanet-macos-universal.dmg \
            syrius-alphanet-linux-amd64.zip > SHA256CHECKSUMS.txt
          sha256sum --check SHA256CHECKSUMS.txt
      - name: Upload files to a GitHub release
        uses: svenstaro/upload-release-action@04733e069f2d7f7f0b4aebc4fbdbce8613b03ccd # 2.9.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          release_name: ${{ env.SYRIUS_VERSION }}
          prerelease: ${{ contains(env.SYRIUS_VERSION, '-') }}
          tag: ${{ env.SYRIUS_VERSION }}
          file_glob: true
          file: releases/*
          overwrite: true
          body: ${{ env.BODY }}
