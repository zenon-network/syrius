name: Update embedded libznn binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'go-zenon release tag (e.g. v0.0.10-alphanet); leave blank for latest'
        required: false
        default: ''
        type: string
      target_branch:
        description: 'Target branch for the update pull request'
        required: false
        default: 'develop'
        type: choice
        options:
          - develop
          - master
      dry_run:
        description: 'Verify upstream release and checksums without opening a pull request'
        required: false
        default: false
        type: boolean
      allow_downgrade:
        description: 'Allow downgrading embedded libznn to an older go-zenon release tag'
        required: false
        default: false
        type: boolean
  schedule:
    # Weekly check every Monday at 06:00 UTC for new zenon-network/go-zenon releases
    - cron: '0 6 * * 1'

permissions: {}

concurrency:
  group: syrius-lib-updater-${{ inputs.target_branch || 'develop' }}
  cancel-in-progress: false

jobs:
  update-libznn:
    name: Check and update libznn
    if: github.event_name != 'schedule' || github.repository == 'zenon-network/syrius'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Resolve workflow configuration
        id: config
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_TARGET_BRANCH: ${{ inputs.target_branch }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade }}
        run: |
          set -euo pipefail

          target_branch="${INPUT_TARGET_BRANCH:-develop}"
          case "$target_branch" in
            develop|master) ;;
            *)
              echo "::error::Unsupported target_branch: ${target_branch} (allowed: develop, master)"
              exit 1
              ;;
          esac

          if [[ "${INPUT_TAG:-}" == *$'\n'* || "${INPUT_TAG:-}" == *$'\r'* ]]; then
            echo "::error::Invalid go-zenon release tag: multiline values are not allowed"
            exit 1
          fi
          tag="$(printf '%s' "${INPUT_TAG:-}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [[ -n "$tag" ]]; then
            if [[ ! "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]] || [[ "$tag" == *".."* ]]; then
              echo "::error::Invalid go-zenon release tag format: ${tag}"
              exit 1
            fi
          fi

          dry_run="false"
          if [[ "${INPUT_DRY_RUN:-false}" == "true" ]]; then
            dry_run="true"
          fi

          allow_downgrade="false"
          if [[ "${INPUT_ALLOW_DOWNGRADE:-false}" == "true" ]]; then
            allow_downgrade="true"
          fi

          {
            echo "target_branch=${target_branch}"
            echo "tag=${tag}"
            echo "dry_run=${dry_run}"
            echo "allow_downgrade=${allow_downgrade}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout updater scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          path: workflow-scripts
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Run updater unit tests
        run: python3 -m unittest discover -s workflow-scripts/.github/scripts -p 'test_*.py' -v

      - name: Checkout target branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.config.outputs.target_branch }}
          path: target-repo
          persist-credentials: false

      - name: Fetch go-zenon release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GO_ZENON_TAG: ${{ steps.config.outputs.tag }}
          WORK_DIR: ${{ runner.temp }}/libznn-update
        run: |
          set -euo pipefail

          mkdir -p "$WORK_DIR"
          args=(
            --fetch-metadata-only
            --metadata-out "$WORK_DIR/release.json"
          )
          if [[ -n "${GO_ZENON_TAG:-}" ]]; then
            args+=("--tag=${GO_ZENON_TAG}")
          fi

          python3 workflow-scripts/.github/scripts/update_libznn.py "${args[@]}"

      - name: Download, verify, and stage libznn binaries
        id: update
        env:
          GO_ZENON_TAG: ${{ steps.config.outputs.tag }}
          TARGET_BRANCH: ${{ steps.config.outputs.target_branch }}
          DRY_RUN: ${{ steps.config.outputs.dry_run }}
          ALLOW_DOWNGRADE: ${{ steps.config.outputs.allow_downgrade }}
          WORK_DIR: ${{ runner.temp }}/libznn-update
        run: |
          set -euo pipefail

          args=(
            --repo-root target-repo
            --work-dir "$WORK_DIR"
            --release-json "$WORK_DIR/release.json"
            --target-branch "$TARGET_BRANCH"
            --pr-body-out "$WORK_DIR/pr-body.md"
            --github-output "$GITHUB_OUTPUT"
            --step-summary "$GITHUB_STEP_SUMMARY"
          )
          if [[ -n "${GO_ZENON_TAG:-}" ]]; then
            args+=("--tag=${GO_ZENON_TAG}")
          fi
          if [[ "${DRY_RUN:-false}" == "true" ]]; then
            args+=(--dry-run)
          fi
          if [[ "${ALLOW_DOWNGRADE:-false}" == "true" ]]; then
            args+=(--allow-downgrade)
          fi

          python3 workflow-scripts/.github/scripts/update_libznn.py "${args[@]}"

      - name: Check rolling PR branch for protected open PR
        id: pr_guard
        if: >-
          steps.update.outputs.changed == 'true' &&
          steps.update.outputs.is_default_pr_branch == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ steps.config.outputs.target_branch }}
          PR_BRANCH: ${{ steps.update.outputs.pr_branch }}
          RELEASE_TAG: ${{ steps.update.outputs.release_tag }}
        run: |
          set -euo pipefail
          python3 workflow-scripts/.github/scripts/close_stale_libznn_pr.py \
            --check-update-safe \
            --repo "$GITHUB_REPOSITORY" \
            --target-branch "$TARGET_BRANCH" \
            --pr-branch "$PR_BRANCH" \
            --release-tag "$RELEASE_TAG" \
            --github-output "$GITHUB_OUTPUT" \
            --step-summary "$GITHUB_STEP_SUMMARY"

      # Requires repo setting: Settings -> Actions -> General -> Workflow permissions ->
      # "Allow GitHub Actions to create and approve pull requests".
      # Note: PRs created with GITHUB_TOKEN create pull_request CI runs that require approval.
      # A maintainer with write access must select "Approve workflows to run" in the merge box.
      # If no runs appear, check the workflow triggers and branch filters.
      - name: Create or update pull request
        id: cpr
        if: >-
          steps.update.outputs.changed == 'true' &&
          (steps.update.outputs.is_default_pr_branch != 'true' ||
            steps.pr_guard.outputs.safe_to_update == 'true')
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: target-repo
          add-paths: |
            lib/embedded_node/blobs/libznn.so
            lib/embedded_node/blobs/libznn.dylib
            lib/embedded_node/blobs/libznn.dll
            lib/embedded_node/blobs/libznn.manifest.json
          base: ${{ steps.config.outputs.target_branch }}
          branch: ${{ steps.update.outputs.pr_branch }}
          delete-branch: true
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: ${{ steps.update.outputs.commit_message }}
          title: ${{ steps.update.outputs.pr_title }}
          body-path: ${{ steps.update.outputs.pr_body_path }}

      - name: Record pull request outcome
        if: >-
          steps.update.outputs.changed == 'true' &&
          (steps.update.outputs.is_default_pr_branch != 'true' ||
            steps.pr_guard.outputs.safe_to_update == 'true')
        env:
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          PR_OPERATION: ${{ steps.cpr.outputs.pull-request-operation }}
          PR_BRANCH: ${{ steps.cpr.outputs.pull-request-branch }}
        run: |
          set -euo pipefail
          {
            echo ""
            echo "### Pull request"
            if [[ -n "${PR_URL:-}" ]]; then
              echo "- **Operation:** \`${PR_OPERATION:-unchanged}\`"
              echo "- **Branch:** \`${PR_BRANCH:-}\`"
              echo "- **PR:** ${PR_URL}"
            else
              echo "- No pull request changes were required."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Close stale pull request when already up to date
        id: close_stale
        if: >-
          steps.config.outputs.tag == '' &&
          steps.config.outputs.allow_downgrade == 'false' &&
          steps.update.outputs.changed == 'false' &&
          steps.update.outputs.updates_detected == 'false' &&
          steps.update.outputs.is_default_pr_branch == 'true' &&
          steps.config.outputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ steps.config.outputs.target_branch }}
          PR_BRANCH: ${{ steps.update.outputs.pr_branch }}
          RELEASE_TAG: ${{ steps.update.outputs.release_tag }}
        run: |
          set -euo pipefail
          python3 workflow-scripts/.github/scripts/close_stale_libznn_pr.py \
            --repo "$GITHUB_REPOSITORY" \
            --target-branch "$TARGET_BRANCH" \
            --pr-branch "$PR_BRANCH" \
            --release-tag "$RELEASE_TAG" \
            --github-output "$GITHUB_OUTPUT" \
            --step-summary "$GITHUB_STEP_SUMMARY"
