name: PR Fast Validation

on:
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-and-manifest-validation:
    name: CI Scripts and libznn Manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2

      - name: Run CI script unit tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Verify embedded libznn provenance manifest
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          args=(--repo-root .)
          if [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" ]]; then
            if git rev-parse --verify "HEAD^2" >/dev/null 2>&1; then
              # GitHub checks out refs/pull/<n>/merge; HEAD^1 is the exact base parent of this merge.
              args+=(--base-ref "HEAD^1" --head-ref HEAD)
            elif [[ -n "${BASE_SHA:-}" ]]; then
              if ! git rev-parse --verify "${BASE_SHA}^{commit}" >/dev/null 2>&1; then
                git fetch --no-tags --depth=1 origin "$BASE_SHA"
              fi
              args+=(--base-ref "$BASE_SHA" --head-ref HEAD)
            fi
          fi
          python3 .github/scripts/verify_libznn_manifest.py "${args[@]}"

  analyze-and-test:
    name: Analyze and Unit Tests
    if: github.event_name != 'pull_request' || github.base_ref == 'develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Install Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze repository
        run: flutter analyze --no-pub

      - name: Run unit and widget tests
        run: flutter test --no-pub test --exclude-tags chain --exclude-tags bend

      - name: Check generated files are up to date
        run: |
          # Generated Dart files are committed in this repository. Regenerating
          # them in CI catches stale JSON/Hive/BDD outputs before they are merged.
          dart run build_runner build
          dart format integration_test
          git diff --exit-code
