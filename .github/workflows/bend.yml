name: Bend Laws

on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      depth:
        description: 'Maximum exhaustive operation sequence depth (1-4)'
        type: choice
        options: ['2', '3', '4']
        default: '3'
      seed:
        description: 'Deterministic seed for sampled conformance histories'
        type: string
        default: '1'

permissions:
  contents: read

concurrency:
  group: bend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bend-laws:
    name: Bend Proofs, Conformance, and Fault Detection
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Install Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run Bend harness unit tests
        run: python3 -B -m unittest discover -s test/bend -p 'test_*.py' -v

      - name: Run full Bend proof, verdict, conformance, and mutation gate
        env:
          BEND_DEPTH: ${{ inputs.depth || '3' }}
          BEND_SEED: ${{ inputs.seed || github.run_number }}
        run: ./test/bend/run.sh

      - name: Dump failure logs
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          for log in .bend-work/run-*/*.log; do
            echo "::group::$(basename "$log")"
            tail -n 200 "$log"
            echo '::endgroup::'
          done

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bend-law-logs
          path: .bend-work/run-*/*.log
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
